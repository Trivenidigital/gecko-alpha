name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the reviewer-clearance gate resolves SHAs that
          # a shallow clone does not contain, and a missing commit there
          # is indistinguishable from a revoked clearance.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Reviewer-clearance gate (ruling D)
        # pull_request only: this repo squash-merges, so after a merge the
        # clearance SHAs are no longer ancestors of master and the gate would
        # fail every push. The revision under review is the PR head.
        if: github.event_name == 'pull_request'
        run: |
          git fetch --quiet origin "$GITHUB_BASE_REF" || true
          uv run python scripts/check_reviewer_clearances.py "${{ github.event.pull_request.head.sha }}"

      - name: Dashboard contract firewalls
        timeout-minutes: 5
        run: >
          uv run pytest --tb=short -q
          tests/test_check_dashboard_contracts.py
          tests/test_check_live_candidates_contract.py
          tests/test_live_candidates_endpoint.py
          tests/test_check_trade_inbox_contract.py
          tests/test_trade_inbox_endpoint.py
        env:
          TELEGRAM_BOT_TOKEN: test
          TELEGRAM_CHAT_ID: test
          ANTHROPIC_API_KEY: test

      - name: Run tests
        # 40, not 25. The suite legitimately runs ~15-16 min on a healthy
        # ubuntu-latest runner (13.5 / 14.3 / 15.0 / 15.3 / 15.4 / 15.5 min
        # across the last seven green master runs) but GitHub shared runners
        # vary by well over 60%: run 32588230863 hit the 25-minute wall with
        # ZERO test failures, and 32519309039 timed out at 62% complete.
        #
        # A timeout is not a test result. Blocking a merge on runner weather
        # trains people to re-run until it passes, which is how a real failure
        # eventually gets re-run away too. Real failures still fail; only the
        # infrastructure ceiling moves.
        #
        # --durations makes the next slowdown diagnosable from the log instead
        # of requiring a bisect: if this budget is ever approached again, the
        # answer should be visible rather than inferred.
        timeout-minutes: 40
        run: >-
          uv run pytest --tb=short -q --timeout=180 --timeout-method=thread
          --durations=15
        env:
          TELEGRAM_BOT_TOKEN: test
          TELEGRAM_CHAT_ID: test
          ANTHROPIC_API_KEY: test

      - name: Regression protection — test count baseline (spec §11.9)
        run: |
          BASELINE_COUNT=1232
          ACTUAL_COUNT=$(uv run pytest --collect-only -q 2>/dev/null | tail -1 | awk '{print $1}')
          echo "baseline=$BASELINE_COUNT actual=$ACTUAL_COUNT"
          test "$ACTUAL_COUNT" -ge "$BASELINE_COUNT" || {
            echo "ERROR: test count dropped from $BASELINE_COUNT to $ACTUAL_COUNT — did you delete tests?"
            exit 1
          }
        env:
          TELEGRAM_BOT_TOKEN: test
          TELEGRAM_CHAT_ID: test
          ANTHROPIC_API_KEY: test
